<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docket - Document Agent for Travelers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="css/selectTravel.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Pretendard', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="h-screen w-screen overflow-hidden flex bg-[#f3f4f6] text-[#1e293b] antialiased state-list" id="app-container">

    <nav class="w-[64px] h-full bg-[#1e3a8a] flex flex-col items-center py-6 border-r border-blue-900 shadow-lg z-30 flex-shrink-0">
        <a href="#" class="w-10 h-10 bg-white text-[#1e3a8a] text-xl font-black flex items-center justify-center rounded-xl shadow-sm mb-10 text-center">D.</a>
        <div class="flex flex-col w-full gap-2">
            <button class="w-full py-4 flex flex-col items-center gap-1.5 bg-blue-800 text-white border-l-4 border-white transition">
                <i class="fa-solid fa-plane-departure text-xl"></i><span class="text-[11px] font-medium tracking-wide">나의 여행</span>
            </button>
            <button class="w-full py-4 flex flex-col items-center gap-1.5 text-blue-200 hover:text-white hover:bg-blue-800/50 border-l-4 border-transparent transition">
                <i class="fa-solid fa-wallet text-xl"></i><span class="text-[11px] font-medium tracking-wide">통합 지갑</span>
            </button>
        </div>
        <div class="mt-auto flex w-full flex-col gap-2">
            <button id="user-info-button" type="button" class="w-full py-4 flex flex-col items-center gap-1.5 text-blue-200 hover:text-white hover:bg-blue-800/50 border-l-4 border-transparent transition" title="사용자 정보">
                <i class="fa-solid fa-user text-xl"></i><span class="text-[11px] font-medium tracking-wide">내 정보</span>
            </button>
            <button id="lnb-signout-button" type="button" class="w-full py-4 flex flex-col items-center gap-1.5 text-blue-200 hover:text-white hover:bg-blue-800/50 border-l-4 border-transparent transition" title="로그아웃">
                <i class="fa-solid fa-right-from-bracket text-xl"></i><span class="text-[11px] font-medium tracking-wide">로그아웃</span>
            </button>
        </div>
    </nav>

    <!-- 패널 1: 여행 목록 -->
    <aside id="list-panel" class="h-full bg-white border-r border-gray-200 flex-col z-20 flex-shrink-0 relative">
        <header class="h-[76px] px-5 border-b border-gray-100 flex items-center justify-between gap-3 bg-white flex-shrink-0">
            <h1 class="text-xl font-bold text-gray-900">여행 정보</h1>
        </header>
        <div id="trip-list-container" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar bg-gray-50/50 pb-28"></div>
        <div class="absolute bottom-0 left-0 w-full p-4 bg-white border-t border-gray-100">
            <button id="add-trip-button" class="w-full bg-[#1e3a8a] hover:bg-[#172554] text-white font-medium py-3 rounded-xl transition-all flex justify-center items-center gap-2">
                <i class="fa-solid fa-plus text-sm"></i> 여행 추가
            </button>
        </div>
    </aside>

    <!-- 패널 2: 타임라인 -->
    <section id="trip-panel" class="h-full bg-gray-50 border-r border-gray-200 flex-col z-20 flex-shrink-0 relative shadow-xl">
        <header class="h-[76px] px-5 border-b border-gray-200 bg-white flex items-center gap-3 flex-shrink-0">
            <button id="close-timeline-button" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-600 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="truncate-text flex-1 flex flex-col justify-center" id="timeline-header-info"></div>
        </header>
        <div id="timeline-container" class="flex-1 overflow-y-auto p-5 space-y-6 custom-scrollbar relative"></div>
        <div class="p-4 bg-white border-t border-gray-200">
            <button id="add-schedule-button" class="w-full bg-[#1e3a8a] hover:bg-[#172554] text-white font-medium py-3 rounded-xl transition-all flex justify-center items-center gap-2">
                <i class="fa-solid fa-plus text-sm"></i> 일정 추가
            </button>
        </div>
    </section>

    <!-- 패널 3: 개별 일정 상세 -->
    <section id="item-panel" class="h-full bg-white border-gray-200 flex-col z-10 flex-shrink-0 relative shadow-2xl">
        <div id="item-loading" class="absolute inset-0 z-20 items-center justify-center bg-white">
            <div class="w-full p-6">
                <div class="detail-skeleton-title mb-3"></div>
                <div class="detail-skeleton-subtitle mb-8"></div>
                <div class="detail-skeleton-card">
                    <div class="detail-skeleton-circle"></div>
                    <div class="detail-skeleton-line detail-skeleton-line-wide"></div>
                    <div class="detail-skeleton-line detail-skeleton-line-short"></div>
                </div>
            </div>
        </div>
        <header class="px-6 py-5 border-b border-gray-100 flex justify-between items-start bg-white" id="item-header"></header>
        <div class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar bg-gray-50/30 w-[450px]" id="item-content"></div>
    </section>

    <!-- 패널 4: 파일 업로드 -->
    <aside id="upload-panel" class="h-full bg-white border-r border-gray-200 flex-col z-20 flex-shrink-0 relative shadow-xl">
        <header class="h-[76px] px-5 border-b border-gray-200 bg-white flex items-center gap-3 flex-shrink-0">
            <button id="close-upload-button" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-600 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 id="upload-panel-title" class="text-xl font-bold text-gray-900">새 여행 문서 업로드</h2>
        </header>
        <div class="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar bg-gray-50/50">
            <div class="bg-white border border-gray-200 rounded-xl p-4">
                <label id="trip-text-label" for="trip-text-input" class="block text-sm font-bold text-gray-700 mb-2">여행 일정 내용</label>
                <textarea id="trip-text-input" rows="4" class="w-full border border-gray-300 rounded-lg p-3 text-sm text-gray-700 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="여행 이름, 일정, 예약 정보를 직접 입력하세요."></textarea>
            </div>
            <ul class="text-xs text-gray-500 list-disc pl-4 mb-4">
                    <li>Drag and Drop 지원</li>
                    <li>PDF, PNG, JPG 다중 선택 지원</li>
                </ul>
            <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-10 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-gray-50 transition bg-white">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-gray-400 mb-3"></i>
                <p class="text-sm font-bold text-gray-700">마우스로 파일을 끌어오세요</p>
                <p class="text-xs text-gray-400 mt-1">또는 클릭하여 파일 선택</p>
                <input type="file" id="file-input" multiple accept=".pdf,image/*" class="hidden">
            </div>
            <div id="file-list-container" class="space-y-2 mt-4 empty:hidden"></div>
            <div id="upload-progress-container" class="hidden mt-6">
                <div class="flex justify-between text-xs mb-1">
                    <span class="font-bold text-blue-700">문서 분석 중...</span>
                    <span id="progress-text" class="text-gray-500">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
        <div class="p-4 bg-white border-t border-gray-100 flex gap-2">
            <button id="clear-files-button" class="w-1/3 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-3 rounded-xl transition">초기화</button>
            <button id="btn-parse" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-3 rounded-xl transition opacity-50 cursor-not-allowed" disabled>문서 분석 시작</button>
        </div>
    </aside>

    <main id="map-area" class="map-area bg-[#e2e8f0] overflow-hidden z-0">
        <div id="map" class="absolute inset-0"></div>
        <div id="map-fallback" class="absolute inset-0 flex items-center justify-center bg-slate-200/80 p-6 text-center">
            <div class="bg-white/85 px-8 py-6 rounded-3xl backdrop-blur-md shadow-sm">
                <i class="fa-solid fa-map-location-dot text-4xl text-[#1e3a8a] mb-3"></i>
                <p id="map-status" class="text-lg font-bold text-gray-500">Google Maps API 키를 설정하면 지도가 표시됩니다.</p>
            </div>
        </div>
    </main>

    <div id="user-info-modal" class="user-modal hidden" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
        <section class="user-modal-card">
            <div class="user-page-heading">
                <button id="close-user-modal-button" class="user-back-button" type="button" aria-label="사용자 정보 닫기">&times;</button>
                <div>
                    <p class="login-eyebrow">ACCOUNT</p>
                    <h1 id="user-modal-title">사용자 정보</h1>
                </div>
            </div>
            <div id="user-modal-content" class="user-profile-content"></div>
        </section>
    </div>

    <script src="js/config.local.js"></script>
    <script src="js/google-auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
