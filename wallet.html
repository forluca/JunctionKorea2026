<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docket 통합 지갑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/selectTravel.css">
</head>
<body class="wallet-page">
    <nav class="w-[64px] h-full bg-[#1e3a8a] flex flex-col items-center py-6 border-r border-blue-900 shadow-lg z-30 flex-shrink-0">
        <a href="main.html" class="w-10 h-10 bg-white text-[#1e3a8a] text-xl font-black flex items-center justify-center rounded-xl shadow-sm mb-10 text-center">D.</a>
        <div class="flex flex-col w-full gap-2">
            <a href="main.html" class="w-full py-4 flex flex-col items-center gap-1.5 text-blue-200 hover:text-white hover:bg-blue-800/50 border-l-4 border-transparent transition">
                <i class="fa-solid fa-plane-departure text-xl"></i><span class="text-[11px] font-medium tracking-wide">나의 여행</span>
            </a>
            <a href="wallet.html" class="w-full py-4 flex flex-col items-center gap-1.5 bg-blue-800 text-white border-l-4 border-white transition">
                <i class="fa-solid fa-wallet text-xl"></i><span class="text-[11px] font-medium tracking-wide">통합 지갑</span>
            </a>
        </div>
        <div class="mt-auto flex w-full flex-col gap-2">
            <a href="user.html" class="w-full py-4 flex flex-col items-center gap-1.5 text-blue-200 hover:text-white hover:bg-blue-800/50 border-l-4 border-transparent transition" title="사용자 정보">
                <i class="fa-solid fa-user text-xl"></i><span class="text-[11px] font-medium tracking-wide">내 정보</span>
            </a>
            <button id="wallet-signout-button" type="button" class="w-full py-4 flex flex-col items-center gap-1.5 text-blue-200 hover:text-white hover:bg-blue-800/50 border-l-4 border-transparent transition" title="로그아웃">
                <i class="fa-solid fa-right-from-bracket text-xl"></i><span class="text-[11px] font-medium tracking-wide">로그아웃</span>
            </button>
        </div>
    </nav>
    <main class="wallet-main">
        <header class="wallet-header">
            <div>
                <p class="wallet-eyebrow">YOUR PASSES</p>
                <h1>통합 지갑</h1>
                <p>여행별 예약 패스를 한곳에서 확인하세요.</p>
            </div>
        </header>
        <div id="wallet-content" class="wallet-content"></div>
    </main>
    <script src="js/config.local.js"></script>
    <script src="js/google-auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/wallet.js"></script>
</body>
</html>
